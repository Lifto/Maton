# backlog.yaml — Task Queue
#
# The dispatcher reads this file to find work. Tasks are processed in priority
# order. Only tasks with status "ready" are eligible for execution.
#
# This file is the maton's to-do list. Humans and matons both write to it.
# Drop a task here and the next dispatch cycle picks it up.
#
# Priority: critical > high > normal > low > someday
# Status:   ready | in_progress | blocked | done | cancelled
#
# Schema:
#   id:          Unique identifier (task-NNN or descriptive slug)
#   summary:     One-line description of what needs to happen
#   priority:    critical | high | normal | low | someday
#   status:      ready | in_progress | blocked | done | cancelled
#   created:     ISO date when the task was added
#   context:     Free-text background — why this task exists, relevant details
#   acceptance:  List of concrete conditions that mean "done"
#   blocked_by:  List of task IDs that must complete first (empty = unblocked)
#   result:      Free-text summary of what happened (filled on completion)
#   completed:   ISO date when the task was finished

tasks: []

