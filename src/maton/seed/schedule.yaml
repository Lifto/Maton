# schedule.yaml — Recurring Tasks
#
# The dispatcher checks this file for tasks that are due. When a recurring task
# is due, the dispatcher either executes it directly or creates a backlog entry.
#
# Frequency: daily | weekly | hourly | every_N_minutes
# For weekly tasks, specify `day` (monday, tuesday, ...).
# For daily tasks, specify `time` (HH:MM, 24-hour, local timezone).
#
# Schema:
#   id:          Unique identifier
#   summary:     What this recurring task does
#   frequency:   How often it runs
#   time:        When during the day (HH:MM) — optional for sub-daily
#   day:         Day of week — required for weekly
#   skill:       Path to a skill file that executes this task (optional)
#   inline:      Inline instructions if no skill file exists (optional)
#   last_run:    ISO datetime of last execution (updated by dispatcher)
#   enabled:     true | false

recurring: []

